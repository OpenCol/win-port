name: ci

on:
  push:
  pull_request:

jobs:
  build:
    # Roadmap W0: a Linux runner, the i686 MinGW build, tests under Wine (used only as a test
    # host for the Win32 build). `import/import.py --check` needs col-win-re, which CI cannot
    # reach; it runs locally and records its result in status/import.json.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: STATUS.md is what status/*.json says
        run: python3 tools/status.py --check
      - name: include/gen is what tools/gen_headers.py writes
        run: python3 tools/gen_headers.py --check
      - name: Toolchains
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends \
            gcc-mingw-w64-i686 g++-mingw-w64-i686 cmake xvfb wine wine32:i386
      - name: Build (MinGW, 32-bit x86)
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=toolchains/mingw-i686.cmake
          cmake --build build
      - name: Self-test under Wine
        run: WINEDEBUG=-all xvfb-run -a wine build/port_selftest.exe

  compile:
    # Roadmap W1: every file in src/ compiles, with each toolchain. The record each run writes
    # is uploaded; tools/ci_record.py downloads it into status/ (winegcc runs only here).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [mingw-i686, winegcc]
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo apt-get update -q
          if [ "${{ matrix.toolchain }}" = mingw-i686 ]; then
            sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-i686 g++-mingw-w64-i686
          else
            sudo apt-get install -y -q --no-install-recommends wine64-tools gcc-multilib g++-multilib
            # the package may keep winegcc/wineg++ off PATH (/usr/lib/wine): link them onto it
            for t in winegcc wineg++; do
              command -v $t || sudo ln -sf "$(dpkg -L wine64-tools | grep -E "/$t\$" | head -1)" /usr/local/bin/$t
            done
            winegcc --version | head -1
          fi
      - name: Every file compiles (W1)
        run: python3 tools/compile_all.py --toolchain ${{ matrix.toolchain }} --record
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-${{ matrix.toolchain }}
          path: status/compile-${{ matrix.toolchain }}.json
