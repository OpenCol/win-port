name: ci

on:
  push:
  pull_request:
  # a release by hand (Actions -> ci -> Run workflow), or tools/release.sh, which pushes a v* tag
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. v0.1.0 (empty: build the kits, publish nothing)"
        required: false
        default: ""
      prerelease:
        description: "Mark it a pre-release"
        type: boolean
        default: true

# a newer push to a branch supersedes the run still going on it (pushes come in bursts; each
# run is ~10 runner minutes, and the org's private-repo minutes are a monthly budget); a release
# -- by hand or a v* tag -- is never cancelled
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  compile:
    # Roadmap W1: every file in src/ compiles, with each toolchain. The record each run writes
    # is uploaded; tools/ci_record.py downloads it into status/ (winegcc runs only here).
    # Each leg's link step builds the program the kits carry (W10) and uploads it: the
    # mingw-i686 leg build/colonize.exe (32-bit, runs on 32- and 64-bit Windows), the winegcc
    # leg the Linux program, Winelib i386 (W8). The 64-bit program (W9) is no longer released
    # (2026-10-14). The mingw-i686 leg also runs W0 (status checks, the self-test under Wine).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        toolchain: [mingw-i686, winegcc]
    steps:
      - uses: actions/checkout@v4
      - name: STATUS.md is what status/*.json says (W0)
        if: matrix.toolchain == 'mingw-i686'
        run: python3 tools/status.py --check
      - name: include/gen is what tools/gen_headers.py writes (W0)
        if: matrix.toolchain == 'mingw-i686'
        run: python3 tools/gen_headers.py --check
      - name: Toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          if [ "${{ matrix.toolchain }}" = mingw-i686 ]; then
            # cmake, xvfb, wine: W0's self-test (Wine is only its test host)
            sudo apt-get install -y -q --no-install-recommends \
              gcc-mingw-w64-i686 g++-mingw-w64-i686 cmake xvfb wine wine32:i386
          else
            # i386: the link (W8) needs Wine's 32-bit import libraries and runtime
            sudo apt-get install -y -q --no-install-recommends wine64-tools gcc-multilib g++-multilib \
              libwine-dev:i386 wine32:i386
            # the package keeps winegcc off PATH and ships no wineg++: winegcc picks C or C++ by the
            # name it runs under, so both names link to it
            w=$(command -v winegcc || dpkg -L wine64-tools | grep -E '/winegcc$' | head -1)
            test -n "$w"
            sudo ln -sf "$w" /usr/local/bin/winegcc
            sudo ln -sf "$w" /usr/local/bin/wineg++
            winegcc --version | head -1; wineg++ --version | head -1
          fi
      - name: Build (MinGW, 32-bit x86) and self-test under Wine (W0)
        if: matrix.toolchain == 'mingw-i686'
        run: |
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=toolchains/mingw-i686.cmake
          cmake --build build
          WINEDEBUG=-all xvfb-run -a wine build/port_selftest.exe
      - name: One file, with the commands the driver runs
        run: |
          python3 - <<'PY'
          import subprocess, sys, time
          sys.path.insert(0, "tools")
          import compile_all as c
          cc, cxx, extra = c.TOOLCHAINS["${{ matrix.toolchain }}"]
          for drv, lang, std, f in ((cc, "c", "gnu99", "src/game/max_ptr_1050_97d1.c"),
                                    (cxx, "c++", "gnu++03", "src/game/Popup_ctor.c")):
              cmd = [drv, "-v", "-x", lang, "-std=" + std] + extra + ["-fsyntax-only", "-Wall",
                     "-I", "include/gen", "-I", "include", f]
              t = time.time()
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, stdin=subprocess.DEVNULL, timeout=60)
                  print("%s: exit %d in %.1fs" % (f, r.returncode, time.time() - t))
                  print("\n".join(r.stderr.splitlines()[-15:]))
              except subprocess.TimeoutExpired as e:
                  print("%s: TIMED OUT after 60s" % f)
                  print((e.stderr or b"")[-3000:].decode(errors="replace"))
          PY
      - name: Every file compiles (W1)
        timeout-minutes: 30
        run: python3 tools/compile_all.py --toolchain ${{ matrix.toolchain }} --record
      - name: It links, only the W4/W5 backlog trapped (W2); the Windows x86 program (W10)
        if: matrix.toolchain == 'mingw-i686'
        run: python3 tools/undefined.py
      - name: The Linux program links (W8, Winelib i386)
        if: matrix.toolchain == 'winegcc'
        run: PORT_TOOLCHAIN=winegcc python3 tools/undefined.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compile-${{ matrix.toolchain }}
          path: status/compile-${{ matrix.toolchain }}.json
      - uses: actions/upload-artifact@v4
        if: matrix.toolchain == 'mingw-i686'
        with:
          name: programs-windows
          path: |
            build/colonize.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.toolchain == 'winegcc'
        with:
          name: programs-linux
          path: |
            build/linux/colonize.exe.so
            build/linux/colonize.exe
          if-no-files-found: error

  kits:
    # Roadmap W10: the release kits, one zip per platform -- the port and its launcher, no game
    # files (tools/kit.py). Each is a downloadable artifact of the run (the kit's own zip inside:
    # an artifact keeps no file modes, and the Linux/macOS launcher must stay executable); a v*
    # tag also publishes them as a GitHub release.
    needs: [compile]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Toolchains (the launchers)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends gcc-mingw-w64-i686
      - uses: actions/download-artifact@v4
        with:
          name: programs-windows
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: programs-linux
          path: build/linux
      - name: Version
        id: version
        run: |
          # a v* tag or a version given by hand is a release; anything else a build
          if [ -n "${{ inputs.version }}" ]; then v="${{ inputs.version }}"; rel=1
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="$GITHUB_REF_NAME"; rel=1
          else v="${GITHUB_REF_NAME}-${GITHUB_SHA::7}"; rel=0; fi
          case "$v" in v[0-9]*) ;; *) [ "$rel" = 0 ] || { echo "a release version is v<digits>...: $v"; exit 1; } ;; esac
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "release=$rel" >> "$GITHUB_OUTPUT"
      - name: Kits
        run: |
          ls -lR build | head -20
          python3 tools/kit.py --version "${{ steps.version.outputs.version }}"
          python3 tools/release_notes.py "${{ steps.version.outputs.version }}"
      - uses: actions/upload-artifact@v4
        with:
          name: colonization-port-windows-x86
          path: dist/colonization-port-windows-x86.zip
      - uses: actions/upload-artifact@v4
        with:
          name: colonization-port-linux-i386
          path: dist/colonization-port-linux-i386.zip
      - uses: actions/upload-artifact@v4
        with:
          name: colonization-port-macos
          path: dist/colonization-port-macos.zip
      - name: Release
        if: steps.version.outputs.release == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRE: ${{ (inputs.prerelease == false && 'false') || 'true' }}
        run: |
          # the tag is made at this commit when the release was asked for by hand
          flags=""
          [ "$PRE" = true ] && flags="--prerelease"
          gh release create "$VERSION" dist/colonization-port-*.zip dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "Colonization port $VERSION" --notes-file dist/RELEASE_NOTES.md $flags
